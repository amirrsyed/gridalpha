# LAB BRANCH ONLY (never merged): same as main's retrain, plus optional inputs that apply a code
# patch and run an analysis script, so experiments run on real data without a new branch each time.
name: retrain
on:
  workflow_dispatch:
    inputs:
      from_stage:
        type: choice
        default: ingest
        options: [ingest, validate, features, pretrain, baselines, train, calibrate, backtest, signals, publish]
      until_stage:
        type: choice
        default: publish
        options: [ingest, validate, features, pretrain, baselines, train, calibrate, backtest, signals, publish]
      run_autopilot:
        type: boolean
        default: true
      patch_b64:
        description: "base64 tar.gz of files to overlay on the checkout"
        default: ""
      script_b64:
        description: "base64 Python script to run after the autopilot"
        default: ""
permissions:
  contents: read
  issues: write
concurrency:
  group: gridalpha-retrain
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
      ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
      ERCOT_PUBLIC_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_PUBLIC_API_SUBSCRIPTION_KEY }}
      GRIDALPHA_NO_ISSUES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Apply lab patch
        env:
          PATCH: ${{ github.event.inputs.patch_b64 }}
        run: |
          if [ -n "$PATCH" ]; then echo "$PATCH" | base64 -d | tar -xz -C . && echo "patch applied"; git status --short; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Deploy the Modal app (GPU functions)
        if: github.event.inputs.run_autopilot == 'true'
        run: modal deploy -m gridalpha.cloud.modal_app
      - name: Restore data cache, models and pipeline state from the Modal volume
        run: python -m gridalpha.cloud.sync pull
      - name: Autopilot
        if: github.event.inputs.run_autopilot == 'true'
        timeout-minutes: 320
        run: >
          python -m gridalpha.cli run
          --from ${{ github.event.inputs.from_stage }}
          --until ${{ github.event.inputs.until_stage }}
          --set project.data_source=ercot --set compute.backend=modal
      - name: Save data cache, models and state
        if: always() && github.event.inputs.run_autopilot == 'true'
        run: python -m gridalpha.cloud.sync push
      - name: Lab script
        if: always()
        env:
          SCRIPT: ${{ github.event.inputs.script_b64 }}
        run: |
          if [ -n "$SCRIPT" ]; then echo "$SCRIPT" | base64 -d > lab.py && python lab.py; fi
