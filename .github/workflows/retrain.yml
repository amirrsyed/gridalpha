# Weekly (and on demand): fresh ERCOT data and a full walk-forward retrain on cloud GPUs through Modal.
# The autopilot fans fold x seed jobs out in parallel, checks every gate, and opens an issue for
# the Claude Code agent if anything fails. Spend is capped by compute.monthly_budget_usd.
name: retrain
on:
  schedule:
    - cron: "0 6 * * 0"        # Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      from_stage:
        description: "Start from this stage (ingest = fetch new data and redo everything)"
        type: choice
        default: ingest
        options: [ingest, validate, features, pretrain, baselines, train, calibrate, backtest, signals, publish]
      until_stage:
        description: "Stop after this stage (features = data only, no GPU cost)"
        type: choice
        default: publish
        options: [ingest, validate, features, pretrain, baselines, train, calibrate, backtest, signals, publish]
permissions:
  contents: read
  issues: write
concurrency:
  group: gridalpha-retrain
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
      ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
      ERCOT_PUBLIC_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_PUBLIC_API_SUBSCRIPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Deploy the Modal app (GPU functions)
        run: modal deploy -m gridalpha.cloud.modal_app
      - name: Restore data cache, models and pipeline state from the Modal volume
        run: python -m gridalpha.cloud.sync pull
      - name: Autopilot
        timeout-minutes: 320      # leaves time for the save step below before the job limit
        run: >
          python -m gridalpha.cli run
          --from ${{ github.event.inputs.from_stage || 'ingest' }}
          --until ${{ github.event.inputs.until_stage || 'publish' }}
          --set project.data_source=ercot --set compute.backend=modal
      - name: Save data cache, models and state (also after a failure, so the next run resumes)
        if: always()
        run: python -m gridalpha.cloud.sync push
      - name: Keep the dashboard data from this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-json
          path: artifacts/site/signals.json
          if-no-files-found: ignore
