# Daily: pull fresh ERCOT data, produce tomorrow's tickets with the current models, publish the dashboard.
# Runs at 13:35 UTC (07:35 CST / 08:35 CDT), well before the 10:00 CT day-ahead bid deadline.
# Until a retrain has passed every gate, it exits early with a notice and publishes nothing.
name: daily-signals
on:
  schedule:
    - cron: "35 13 * * *"
  workflow_dispatch:
permissions:
  contents: write          # the AI engineer step pushes a fix branch
  pull-requests: write
  issues: write
  actions: read
  id-token: write          # lets the Claude GitHub App act, so its pull requests trigger CI
  pages: write
concurrency:
  group: gridalpha-daily
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ready: ${{ steps.daily.outputs.ready }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
      ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
      ERCOT_PUBLIC_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_PUBLIC_API_SUBSCRIPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Restore models, data cache and pipeline state from the Modal volume
        run: python -m gridalpha.cloud.sync pull
      - name: Ingest, validate, features, tickets, export
        id: daily
        run: python -m gridalpha.cli daily --set project.data_source=ercot
      - name: Save artifacts back to the volume
        if: always() && steps.daily.outputs.ready == 'true'
        run: python -m gridalpha.cloud.sync push
      - name: AI engineer (only when the autopilot failed)
        if: failure() && hashFiles('state/ALERT.md') != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The GridAlpha autopilot failed in workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
            state/ALERT.md has the failed stage, gate result, metrics and traceback. Read it and CLAUDE.md first.
            1. Find the cause in the code or data handling. Do not edit config/gates.yaml, the trade section of
               config/default.yaml, or anything in .github/. Never loosen a gate to make it pass.
            2. If the failure is transient (network errors, rate limits) and the code already retries, do not change
               code: comment on the matching open issue (gh issue list --label autopilot) that a rerun should fix it.
            3. Otherwise fix it on a new branch, verify with `python -m pytest -q` and
               `GRIDALPHA_GATES=config/gates_ci.yaml python -m gridalpha.cli run --profile ci`, push, and open a
               pull request against main with `gh pr create`. If an open pull request already addresses this
               failure, comment there instead of opening another.
            4. Comment on the matching open issue with what you found and the pull request link.
          claude_args: >-
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue view:*)"
      - uses: actions/setup-node@v4
        if: steps.daily.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        if: steps.daily.outputs.ready == 'true'
        working-directory: dashboard
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.daily.outputs.ready == 'true'
        with:
          path: dashboard/dist
  deploy:
    needs: signals
    if: needs.signals.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
